version: "2"
run:
  concurrency: 8
  issues-exit-code: 1
  tests: true
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - depguard
    - dogsled
    - dupword
    - durationcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - godot
    - godox
    - goheader
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - lll
    - loggercheck
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - varnamelen
    - wastedassign
    - whitespace
  settings:
    depguard:
      rules:
        prevent_unmaintained_packages:
          list-mode: lax
          files:
            - $all
            - "!$test"
          allow:
            - $gostd
          deny:
            - pkg: io/ioutil
              desc: "replaced by io and os packages since Go 1.16: https://tip.golang.org/doc/go1.16#ioutil"
    dogsled:
      max-blank-identifiers: 2
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - (*mime/multipart.Part).Close
        - (mime/multipart.File).Close
        - (io.ReadCloser).Close
        - fmt.Fprintf(net/http.ResponseWriter)
    funlen:
      lines: 80
      statements: 40
    exhaustive:
      default-signifies-exhaustive: true
    gocognit:
      min-complexity: 40
    goconst:
      min-len: 3
      min-occurrences: 50
    gocritic:
      enabled-tags:
        - performance
      settings:
        captLocal:
          paramsOnly: true
        rangeValCopy:
          sizeThreshold: 32
          skipTestFuncs: true
        hugeParam:
          sizeThreshold: 320
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G101
        - G115
    godox:
      keywords:
        - NOTE
        - OPTIMIZE
        - HACK
    govet:
      enable:
        - atomicalign
        - shadow
      enable-all: false
      disable-all: false
      settings:
        printf:
          funcs:
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf
    lll:
      line-length: 120
      tab-width: 1
    misspell:
      locale: US
      ignore-rules:
        - someword
        - immobilier
        - priorite
        - hébergement
        - cancelled
        - conflit
        - individuel
        - organisation
        - centre
        - activite
    nolintlint:
      require-specific: true
      require-used: true
    modernize:
      disable:
        - newexpr
    nakedret:
      max-func-lines: 30
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    sloglint:
      context: "scope"
    staticcheck:
      # golangci-lint's own default check set, minus SA4023.
      # SA4023 is the only staticcheck check that needs the nilness fact
      # analyzer, and honnef.co/go/tools v0.8.0-rc.1 — the version bundled by
      # golangci-lint v2.13.0 — panics in that analyzer on any function that
      # returns a pointer-like value and calls recover():
      #   internal error: unhandled builtin recover
      # The panic aborts the whole run, so the lint job cannot pass while
      # SA4023 is on. Drop this line when the upstream fix ships.
      # https://github.com/dominikh/go-tools/issues/1725
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -SA4023
    revive:
      rules:
        - name: var-naming
          arguments:
            - [] # AllowList
            - [] # DenyList
            - - skip-package-name-collision-with-go-std: true
    unparam:
      check-exported: false
    varnamelen:
      ignore-names:
        - err
      ignore-decls:
        - c echo.Context
        - c *gin.Context
        - t testing.T
        - i int
        - T any
        - tx pgx.Tx
        - w http.ResponseWriter
        - r *http.Request
        - p []byte
        - n int
        - mr *multipart.Reader
        - mw *multipart.Writer
        - br *bufio.Reader
        - pr *io.PipeReader
        - pw *io.PipeWriter
    whitespace:
      multi-if: false
      multi-func: false
  exclusions:
    generated: lax
    rules:
      - linters:
          - bodyclose
          - containedctx
          - err113
          - forcetypeassert
          - funlen
          - goconst
          - gocritic
          - gosec
          - gosmopolitan
          - lll
          - noctx
          - thelper
          - varnamelen
        path: _test\.go
      - linters:
          - containedctx
          - err113
          - forcetypeassert
          - funlen
          - gocritic
          - gosec
          - lll
          - noctx
          - thelper
          - varnamelen
        path: mocks
      - linters:
          - contextcheck
          - funlen
        path: main\.go
      - linters:
          - dupword
        path: repository/
      # lll: struct field declarations with tags cannot be split
      - linters:
          - lll
        source: '^\s+\w+\s+\S+\s+`'
      # lll: SSM/secret parameter store path loading
      - linters:
          - lll
        source: '\.Load\('
      # lll: const/var string value assignments (permission names, enums, DSNs)
      - linters:
          - lll
        source: '^\s+\w+\s+(\w+\s+)?=\s*"'
      # lll: SQL query builder chains and prepared statements
      - linters:
          - lll
        source: '(ColumnExpr|Join|JoinOn|JoinOnOr|On|PrepareContext)\('
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - _generated\.go$
      - /mocks/
      - third_party$
      - builtin$
      - examples$
